name: UrbanSyn remote sample preflight

on:
  push:
    branches:
      - urban-models-and-benchmark
    paths:
      - "scripts/validate_urbansyn_sample.py"
      - ".github/workflows/validate-urbansyn-sample.yml"
  workflow_dispatch:
    inputs:
      samples:
        description: Number of fully paired samples (1–4)
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4"]

permissions:
  contents: read

jobs:
  urbansyn-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: urban-models-and-benchmark
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dataset inspection dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow huggingface_hub
      - name: Inspect and download only a few matched files
        run: python scripts/validate_urbansyn_sample.py --samples "${{ inputs.samples || '2' }}"
