name: Prepare urban datasets (Google Drive)

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset to validate/prepare
        required: true
        type: choice
        options:
          - bdd100k
          - cityscapes
      drive_source_path:
        description: Folder path inside the configured Drive folder (for example bdd100k)
        required: true
        type: string
        default: bdd100k
      lane_thickness:
        description: BDD100K lane-mask thickness in pixels
        required: false
        type: string
        default: "8"

permissions:
  contents: read

concurrency:
  group: prepare-datasets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block Cityscapes until authorized
        if: inputs.dataset == 'cityscapes'
        run: |
          echo "::error::Cityscapes no está habilitado: registra una cuenta, acepta los términos oficiales y sube los paquetes autorizados a Google Drive antes de activar esta etapa."
          exit 1

      - name: Check Google Drive credentials
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "::error::Configura GDRIVE_SERVICE_ACCOUNT_JSON y GDRIVE_FOLDER_ID en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure read/write access to the Drive folder
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          umask 077
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          rclone config create gdrive drive \
            scope drive \
            service_account_file "$RUNNER_TEMP/gdrive-service-account.json" \
            root_folder_id "$GDRIVE_FOLDER_ID"
          rclone lsd gdrive:

      - name: Download dataset from Google Drive
        env:
          DRIVE_SOURCE_PATH: ${{ inputs.drive_source_path }}
        run: |
          mkdir -p "$RUNNER_TEMP/dataset-source"
          rclone copy "gdrive:$DRIVE_SOURCE_PATH" "$RUNNER_TEMP/dataset-source" --progress --transfers 4
          if [ -z "$(find "$RUNNER_TEMP/dataset-source" -mindepth 1 -print -quit)" ]; then
            echo "::error::La carpeta indicada en Google Drive está vacía o no existe."
            exit 1
          fi

      - name: Install preparation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy 'opencv-python-headless<5'

      - name: Validate dataset and prepare derived files
        env:
          DATASET: ${{ inputs.dataset }}
          LANE_THICKNESS: ${{ inputs.lane_thickness }}
        run: |
          python scripts/prepare_dataset_ci.py \
            --dataset "$DATASET" \
            --source-root "$RUNNER_TEMP/dataset-source" \
            --output-dir "$RUNNER_TEMP/dataset-prepared" \
            --lane-thickness "$LANE_THICKNESS"

      - name: Upload prepared outputs and manifest to Google Drive
        env:
          DATASET: ${{ inputs.dataset }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          DEST="prepared/$DATASET/$RUN_ID-$RUN_ATTEMPT"
          rclone copy "$RUNNER_TEMP/dataset-prepared" "gdrive:$DEST" --progress --transfers 4
          echo "Resultados guardados en Google Drive: $DEST"

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gdrive-service-account.json"
