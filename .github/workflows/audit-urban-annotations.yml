name: Audit urban classes and annotations

on:
  push:
    branches:
      - urban-models-and-benchmark
    paths:
      - "scripts/audit_urban_annotations.py"
      - ".github/workflows/audit-urban-annotations.yml"
      - "tests/test_urban_annotation_audit.py"
  workflow_dispatch:
    inputs:
      manifest_run_id:
        description: Successful manifest-generation workflow run ID
        required: true
        default: "44992977292"
      samples_per_split:
        description: Samples to download and inspect per split and dataset (1-50)
        required: true
        default: "8"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: urban-models-and-benchmark
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded audit dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pillow boto3 huggingface_hub opencv-python-headless
      - name: Download A2D2 manifest artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14742059955
          run-id: ${{ inputs.manifest_run_id || '44992977292' }}
          github-token: ${{ github.token }}
          path: artifacts/manifests
          merge-multiple: true
      - name: Download UrbanSyn manifest artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14741878951
          run-id: ${{ inputs.manifest_run_id || '44992977292' }}
          github-token: ${{ github.token }}
          path: artifacts/manifests
          merge-multiple: true
      - name: Audit class distributions and annotation consistency
        run: |
          python scripts/audit_urban_annotations.py \
            --manifest-dir artifacts/manifests \
            --samples-per-split "${{ inputs.samples_per_split || '8' }}" \
            --output artifacts/annotation_audit_report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: urban-annotation-audit-${{ github.run_id }}
          path: artifacts/annotation_audit_report.json
          if-no-files-found: error
          retention-days: 30
