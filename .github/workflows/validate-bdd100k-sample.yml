name: BDD100K real-sample validation

on:
  push:
    branches:
      - urban-models-and-benchmark
    paths:
      - "scripts/validate_bdd100k_semantic_sample.py"
      - "src/utils/bdd100k_dataset.py"
      - ".github/workflows/validate-bdd100k-sample.yml"
  workflow_dispatch:
    inputs:
      samples_per_split:
        description: Number of real images per split (1–8)
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

permissions:
  contents: read

jobs:
  semantic-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: urban-models-and-benchmark
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime and dataset client
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow huggingface_hub
      - name: Validate real BDD100K semantic samples
        run: |
          python scripts/validate_bdd100k_semantic_sample.py --samples-per-split "${{ inputs.samples_per_split || '2' }}"
