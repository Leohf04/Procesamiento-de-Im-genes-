system:
  backend: "auto"
  device: "auto"
  seed: 42

dataset:
  name: "coco_val2017"
  images_url: "http://images.cocodataset.org/zips/val2017.zip"
  annotations_url: "http://images.cocodataset.org/annotations/annotations_trainval2017.zip"
  base_dir: "data/coco"
  images_dir: "data/coco/val2017"
  annotations_file: "data/coco/annotations/instances_val2017.json"
  processed_dir: "data/processed"
  max_samples: 200
  save_processed_samples: 10

preprocessing:
  gamma_night: 0.45
  gamma_restore: 1.60
  exposure_alpha: 1.15
  exposure_beta: 10
  motion_blur_kernel: 15
  motion_blur_angle: 12.0
  fog_beta: 0.045
  fog_atmospheric_light: 225.0
  rain_drop_count: 600
  rain_drop_length: 18
  rain_slant: -10

models:
  instance:
    confidence_threshold: 0.50
    mask_threshold: 0.50
  semantic_hybrid:
    detector_confidence_threshold: 0.50
    deeplab_urban_voc_ids: [2, 6, 7, 14, 15]
    shared_mask_labels: ["person", "bicycle", "car", "motorcycle", "bus"]
    lane_hsv_white_lower: [0, 0, 185]
    lane_hsv_white_upper: [180, 45, 255]
    lane_hsv_yellow_lower: [15, 80, 120]
    lane_hsv_yellow_upper: [35, 255, 255]

fine_classification:
  model_path: "data/processed/fine_svm_classifier.joblib"
  train_max_rois_per_class: 120
  subclasses_map:
    person: "peaton"
    bicycle: "ciclista_bici"
    motorcycle: "motocicleta"
    car: "vehiculo_ligero"
    bus: "vehiculo_pesado"
    truck: "vehiculo_pesado"
    "traffic light": "semaforo"
    "stop sign": "senal_stop"

target_classes:
  urban_labels: ["person", "bicycle", "car", "motorcycle", "bus", "truck", "traffic light", "stop sign"]
  coco_category_ids: [1, 2, 3, 4, 6, 8, 10, 13]

evaluation:
  iou_threshold: 0.50
  scenarios: ["clear_day", "night", "rain", "fog", "motion_blur"]
  output_dir: "data/outputs"
