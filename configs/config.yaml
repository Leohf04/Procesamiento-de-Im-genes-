system:
  backend: "auto"
  device: "auto"
  seed: 42

dataset:
  name: "cityscapes"
  root: "data/cityscapes"
  coco_images_dir: "data/coco/val2017"
  coco_annotations_file: "data/coco/annotations/instances_val2017.json"
  processed_dir: "data/processed"

preprocessing:
  gamma_night: 0.45
  gamma_restore: 1.60
  exposure_alpha: 1.15
  exposure_beta: 10
  motion_blur_kernel: 15
  motion_blur_angle: 12.0
  fog_beta: 0.045
  fog_atmospheric_light: 225.0
  rain_drop_count: 600
  rain_drop_length: 18
  rain_slant: -10

models:
  instance:
    confidence_threshold: 0.50
    mask_threshold: 0.50
    urban_checkpoint: "data/processed/maskrcnn_cityscapes.pt"
    note: "Carga el checkpoint Cityscapes si existe; en su ausencia usa pesos COCO preentrenados."
  semantic_hybrid:
    architecture: "DeepLabV3Plus-ResNet50"
    checkpoint_path: "data/processed/deeplabv3plus_urban.pt"
    num_classes: 11
    input_size: [512, 1024]
    lane_checkpoint: "data/processed/deeplabv3plus_lanes.pt"
    onnx_semantic_model: "data/processed/urban_semantic.onnx"
    onnx_lane_model: "data/processed/urban_lanes.onnx"
    detector_confidence_threshold: 0.50
    shared_mask_labels: ["person", "bicycle", "car", "motorcycle", "bus"]

fine_classification:
  model_path: "data/processed/fine_svm_classifier.joblib"
  train_max_rois_per_class: 120
  subclasses_map:
    person: "peaton"
    bicycle: "ciclista_bici"
    motorcycle: "motocicleta"
    car: "vehiculo_ligero"
    bus: "vehiculo_pesado"
    truck: "vehiculo_pesado"
    "traffic light": "semaforo"
    "stop sign": "senal_stop"

target_classes:
  urban_labels: ["person", "bicycle", "car", "motorcycle", "bus", "truck", "traffic light", "stop sign"]
  coco_category_ids: [1, 2, 3, 4, 6, 8, 10, 13]

evaluation:
  iou_threshold: 0.50
  scenarios: ["clear_day", "night", "rain", "fog", "motion_blur"]
  output_dir: "data/outputs"
